<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK4 AI</title>
    <style>
        body {
            background-color: #fff8dc;
            color: #4a3b00;
            font-family: "Courier New", Courier, monospace;
            max-width: 650px;
            margin: 1.5rem auto;
            padding: 1rem;
            border: 4px ridge #b8860b;
        }
        .header-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #fde047;
            padding: 0.5rem 1rem;
            border: 2px outset #b8860b;
            margin-bottom: 1rem;
        }
        .header-container img {
            width: 50px;
            height: 50px;
            border: 2px solid #8b6508;
        }
        h1 {
            margin: 0;
            color: #664d03;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-shadow: 1px 1px #fff;
        }
        .subtext {
            font-size: 0.85rem;
            color: #713f12;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        #chat-box {
            border: 3px inset #b8860b;
            height: 320px;
            overflow-y: scroll;
            margin-bottom: 1rem;
            background: #fffaed;
            padding: 0.75rem;
        }
        .message {
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            border-bottom: 1px dashed #ca8a04;
        }
        .user { color: #854d0e; }
        .bot { color: #3f6212; }
        .sender-name {
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }
        #status {
            font-size: 0.85rem;
            color: #854d0e;
            margin-bottom: 0.75rem;
            background: #fef08a;
            padding: 0.4rem;
            border: 1px solid #ca8a04;
        }
        input[type="text"] {
            padding: 0.5rem;
            border: 2px inset #b8860b;
            background-color: #fffaed;
            font-family: "Courier New", Courier, monospace;
        }
        button {
            padding: 0.5rem 1rem;
            background: #eab308;
            color: #422006;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            border: 2px outset #b8860b;
            cursor: pointer;
        }
        button:active {
            border-style: inset;
        }
        button:disabled {
            background: #d6d3d1;
            color: #78716c;
            border-style: solid;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="https://static.wikia.nocookie.net/nicos-nextbots-fanmade/images/e/ee/Epic_Face_but_Cool.png/revision/latest?cb=20230513081248" alt="MARK4 Icon" referrerpolicy="no-referrer">
        <h1>MARK4 AI</h1>
    </div>

    <p class="subtext">>>> SYSTEM TERMINAL v4.0 - LOCAL WEB EXECUTION <<<</p>

    <div id="status">STATUS: Waiting for engine initialization...</div>
    <div id="chat-box"></div>

    <form id="chat-form" style="display: flex; gap: 0.5rem;">
        <input type="text" id="user-input" placeholder="Type command..." disabled style="flex-grow: 1;" required>
        <button type="submit" id="send-btn" disabled>SEND</button>
    </form>

    <button id="load-btn" style="width: 100%; margin-top: 1rem;">[ LOAD MARK4 ENGINE (~130MB) ]</button>

    <script type="module" src="app.js"></script>
</body>
</html>
