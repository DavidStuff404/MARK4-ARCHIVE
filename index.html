<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat.</title>
    <style>
        body {
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVxtGF_bwPOmTRkhTC1TbPg4aLdnwnCiDh35CiAuyVi5OOcdef6Ki52xk&s=10') #000;
            background-size: cover;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            max-width: 650px;
            margin: 1.5rem auto;
            padding: 1rem;
            border: 4px ridge #fff;
        }
        .header-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: #111;
            padding: 0.5rem 1rem;
            border: 2px outset #fff;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-shadow: 1px 1px #000;
        }
        .subtext {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        #chat-box {
            border: 3px inset #fff;
            height: 320px;
            overflow-y: scroll;
            margin-bottom: 1rem;
            background: #111;
            padding: 0.75rem;
        }
        .message {
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            border-bottom: 1px dashed #666;
        }
        .user { color: #ccc; }
        .bot { color: #fff; }
        .sender-name {
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }
        #status {
            font-size: 0.85rem;
            color: #000;
            margin-bottom: 0.75rem;
            background: #fff;
            padding: 0.4rem;
            border: 1px solid #fff;
        }
        input[type="text"] {
            padding: 0.5rem;
            border: 2px inset #fff;
            background-color: #111;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
        }
        button {
            padding: 0.5rem 1rem;
            background: #fff;
            color: #000;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            border: 2px outset #fff;
            cursor: pointer;
        }
        button:active {
            border-style: inset;
        }
        button:disabled {
            background: #333;
            color: #777;
            border-style: solid;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Chat.</h1>
    </div>

    <p class="subtext">>>> IT TERMINAL v4.0 - LOCAL WEB EXECUTION <<<</p>

    <div id="status">STATUS: Waiting for engine initialization...</div>
    <div id="chat-box"></div>

    <form id="chat-form" style="display: flex; gap: 0.5rem;">
        <input type="text" id="user-input" placeholder="Type command..." disabled style="flex-grow: 1;" required>
        <button type="submit" id="send-btn" disabled>SEND</button>
    </form>

    <button id="load-btn" style="width: 100%; margin-top: 1rem;">[ LOAD IT ENGINE (~130MB) ]</button>

    <script type="module" src="app.js"></script>
</body>
</html>
