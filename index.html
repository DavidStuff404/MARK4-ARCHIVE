<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmolLM2 WebLLM Chat</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        #chat-box { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; height: 400px; overflow-y: auto; margin-bottom: 1rem; background: #f9f9f9;}
        .message { margin-bottom: 1rem; line-height: 1.4; }
        .user { color: #0056b3; }
        .bot { color: #0b7a0b; }
        .sender-name { font-weight: bold; margin-bottom: 0.2rem;}
        #status { font-size: 0.9rem; color: #555; margin-bottom: 1rem; font-style: italic; }
        input, button { padding: 0.75rem; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #000; color: #fff; cursor: pointer; }
        button:disabled { background: #666; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>SmolLM2 Local AI Chat</h1>
    <p>This AI runs 100% in your browser using your device's GPU.</p>
    
    <div id="status">Status: Waiting to load model...</div>
    <div id="chat-box"></div>
    
    <form id="chat-form" style="display: flex; gap: 0.5rem;">
        <input type="text" id="user-input" placeholder="Type a message..." disabled style="flex-grow: 1;" required>
        <button type="submit" id="send-btn" disabled>Send</button>
    </form>
    
    <button id="load-btn" style="width: 100%; margin-top: 1rem;">Load AI Model (~130MB)</button>

    <script type="module" src="app.js"></script>
</body>
</html>
